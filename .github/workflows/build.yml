# build.yml — llm-switch 多平台 CI 矩阵（Linux / Windows / macOS）+ tag release。
#
# 形态蓝本：姊妹项目 Clash-Flux 的 .github/workflows/build.yml（已跑通的
# HuxerUI + C++23 modules + import std 解法），按本仓库适配：目标名
# llm-switch、依赖 nlohmann::json + cpp-httplib（本地路由监听；出站转发走
# HuxerUI 平台 HttpClient，无 vendor curl/OpenSSL）+ HuxerUI
# （无 IXWebSocket/SQLiteCpp）、无 mihomo 内核下载、无 Android job；新增
# tag 触发与 release job。
#
# HuxerUI SDK 来源假设（关键）：
#   * 上游 https://github.com/HuxerUI/HuxerUI.git 公开可匿名 clone —— Linux 与
#     macOS job 走「源码通道」：把上游钉在 env.HUXERUI_COMMIT clone 到
#     third_party/huxerui/（该路径已 gitignore，不入库），由顶层 CMakeLists 的
#     优先级 2 add_subdirectory 编译，与本机开发形态一致。
#   * Windows 先由 build-windows-sdk 编译一次同一钉定 commit 的已安装 SDK，上传
#     为 job artifact；build-windows 与 build-windows-installer 下载并复用这份 SDK，
#     两个消费者再并行编译应用/安装器，避免重复编译整个 HuxerUI 框架。
#   * 宿主工具 hcg/hrc 用上游源码内预置（tools/prebuilt/linux/x86_64）：
#     钉住的 commit 区间内 387f315 已刷新预置宿主工具，预置与源码同步；
#     若未来升级 commit 后出现 hrc 报 "unknown path operation"，即预置落后，
#     需在 job 内从 tools/codegen + tools/resource_compiler 重编宿主工具。
#   * 仓库自带离线 tarball（third_party/tarballs/huxerui-sdk-0.2.0-linux-x86_64）
#     只在源码缺失时兜底，CI 不走它（Linux job 装了 gtk4/epoxy/libsoup 开发包，
#     不会触发回落）。
#
# 三个平台均作为发布门禁：Linux、Windows 和 macOS 必须完成编译、测试和打包。
# 工具链沿用 Clash-Flux 实证配方（Windows=MSVC + choco ninja；
# macOS=brew llvm/libc++ + 手写 libc++.modules.json + 内联 P0960 补丁）。
#
# 已知风险：
#   * ubuntu:26.04 是滚动预发布容器，clang-21/libc++-21 包名若随发布调整需同步改。
#   * `import std` 依赖 pip 固定的 cmake==4.4.2（cmake/CxxImportStdGate.cmake
#     的 UUID 表覆盖 3.30–4.4）；升级 CMake 时先查 gate 文件是否已支持新版本。
#   * release job 只在三个构建 job 全部成功且产物存在时运行，避免发布半成品。

name: build

# 触发策略：推 main、开 PR、推 v* tag 都构建（tag 额外触发 release job）。
# 不做"只在发布时构建"的收敛——本仓库是 public，标准 GitHub-hosted runner 的
# Actions 用量对 public 仓库免费（计费文档：usage is free for public
# repositories that use standard GitHub-hosted runners；额度表里的
# 500MB/2000min 是 private 仓库的 plan 配额）。收费的是 larger runners，
# 本仓库只用标准 runner。所以每次 push 构建的边际成本是 0，换来 main 上每次
# 提交都有三平台回执这道安全网。仅 docs/**、**.md 的提交走 paths-ignore 跳过。
# 手动触发（workflow_dispatch）只构建校验：release job 自身有
# startsWith(github.ref, 'refs/tags/v') 判断，不会因为手动跑而创建 Release。
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  HUXERUI_REPO: 'https://github.com/HuxerUI/HuxerUI.git'
  # 该目录 gitignore，不入库，CI 必须自行 clone 并钉 commit，保证可复现。
  # 64264cb 位于 HuxerUI v0.3.0 发布线之后：在 d1d2daa/445488a（ApplicationHandle
  # 的 Clipboard/Directories API、TreeView、模板 manifest CRLF 修复、Windows
  # GUI 子系统启动修复）之上新增 Linux 有界 LRU 文本布局缓存（上游 PR #137）。
  # Windows 主窗口图标仍需本地补丁 cmake/patches/huxerui-windows-icon.patch。
  HUXERUI_COMMIT: '64264cba79d78ee0aed3d46b71550e66bffe7710'

jobs:
  # ------------------------------------------------------------------ Linux
  # 工具链照搬 Clash-Flux 实证配方：ubuntu:26.04 容器 + clang-21/libc++-21。
  # 为什么不是 GCC：CMake 的 GNU import-std 发现要 4.0+ 且依赖 GCC ≥15 的
  # libstdc++.modules.json；apitab 实测 GCC 15 对 vendored 模块包装器报
  # "exposes TU-local entity"（GCC 16 才放宽，而 26.04 的 g++-16 快照会 ICE），
  # clang+libc++ 全链最稳。26.04 的 libc++-21-dev 自带 std 模块与
  # modules.json，但 Debian 打包的相对路径是坏的，下面按 llvm-21 前缀改写。
  build-linux:
    name: build-linux-x86_64
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
    steps:
      - name: Install container baseline
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Check out source
        uses: actions/checkout@v4

      - name: Fetch HuxerUI source (pinned)
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$HUXERUI_REPO" third_party/huxerui
          git -C third_party/huxerui checkout "$HUXERUI_COMMIT"

      - name: Install dependencies
        run: |
          # patchelf 打包改 rpath 用；libsoup 的 HTTPS 由 glib-networking
          # （系统依赖，应用运行环境自带）提供，CI 只需开发头
          apt-get install -y --no-install-recommends \
            clang-21 libc++-21-dev g++ ninja-build pkg-config file gzip \
            dpkg-dev fakeroot rpm \
            python3 python3-pip patchelf \
            libgtk-4-dev libepoxy-dev libsoup-3.0-dev
          # 26.04 的 apt cmake 是 3.31（GNU import-std 发现不行），固定 pip 4.4.2
          python3 -m pip install --break-system-packages -q cmake==4.4.2
          cmake --version | head -1
          # Debian 打包的 libc++.modules.json 相对路径坏指 /lib/share/...，
          # 按 /usr/lib/llvm-21 的真实布局改写为绝对路径
          python3 -c "
          import json
          p = '/usr/lib/x86_64-linux-gnu/libc++.modules.json'
          d = json.load(open(p))
          for m in d['modules']:
              m['source-path'] = '/usr/lib/llvm-21/share/libc++/v1/' + m['source-path'].split('/')[-1]
              m['local-arguments']['system-include-directories'] = ['/usr/lib/llvm-21/share/libc++/v1']
          json.dump(d, open(p, 'w'), indent=1)"

      - name: Configure
        run: |
          # 源码通道：third_party/huxerui 存在且 gtk4/epoxy/libsoup 已装 →
          # 顶层 CMakeLists 优先级 2 自动 add_subdirectory 编译 HuxerUI。
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21 \
            -DCMAKE_CXX_FLAGS='-stdlib=libc++' \
            -DCMAKE_EXE_LINKER_FLAGS='-stdlib=libc++' \
            -DCMAKE_SHARED_LINKER_FLAGS='-stdlib=libc++' \
            -DHUXERUI_PACKAGE=ON

      - name: Build release
        run: cmake --build build --config Release --parallel

      - name: Smoke test
        run: ctest --test-dir build --output-on-failure

      - name: Stage runtime bundle
        run: |
          set -euo pipefail
          mkdir -p dist-src/lib
          cp build/llm-switch dist-src/llm-switch
          chmod +x dist-src/llm-switch
          # HuxerUI 资源包（resources.bin 索引 + 同目录 .huxv/.png payload），
          # POST_BUILD 已拷到 exe 旁边。
          cp -a build/llm-switch.resources dist-src/
          # 源码通道的 libhuxerui.so 在构建树里，随包带出
          huxerui_so="$(find build/huxerui-sdk -name 'libhuxerui.so*' -print -quit)"
          test -n "$huxerui_so"
          cp -L "$huxerui_so" dist-src/lib/libhuxerui.so
          # clang+libc++ 工具链：libc++/libc++abi/libunwind 多数发行版不预装，随包带出
          for lib in libc++.so.1 libc++abi.so.1 libunwind.so.1; do
            p="$(find /usr/lib -name "$lib" -print -quit 2>/dev/null || true)"
            if [ -n "$p" ]; then cp -L "$p" "dist-src/lib/$lib"; fi
          done
          patchelf --set-rpath '$ORIGIN/lib' dist-src/llm-switch
          file dist-src/llm-switch
          ls -la dist-src dist-src/lib

      - name: Package tarball
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf dist/llm-switch-linux-x86_64.tar.gz -C dist-src .
          ls -la dist

      - name: Package Linux deb and rpm
        run: |
          set -euo pipefail
          mkdir -p dist
          cpack --config build/CPackConfig.cmake -G DEB -B dist
          cpack --config build/CPackConfig.cmake -G RPM -B dist
          deb="$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)"
          rpm="$(find dist -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          test -n "$deb" && test -n "$rpm"
          mv "$deb" dist/llm-switch-linux-x86_64.deb
          mv "$rpm" dist/llm-switch-linux-x86_64.rpm
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: llm-switch-linux-x86_64
          path: |
            dist/llm-switch-linux-x86_64.tar.gz
            dist/llm-switch-linux-x86_64.deb
            dist/llm-switch-linux-x86_64.rpm
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------- Windows
  # 先构建一次 SDK；主程序 zip 与 setup.exe 都依赖它，SDK 完成后两个 job 并行。
  build-windows-sdk:
    name: build-huxerui-sdk-windows-x86_64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Fetch HuxerUI source (pinned)
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$HUXERUI_REPO" third_party/huxerui
          git -C third_party/huxerui checkout "$HUXERUI_COMMIT"
          # SDK 中预编译的 Win32 框架也必须保留应用窗口图标支持。
          git -C third_party/huxerui apply "$GITHUB_WORKSPACE/cmake/patches/huxerui-windows-icon.patch"

      - name: Ensure CMake >= 4.4 and Ninja
        shell: pwsh
        run: |
          # import std 的 experimental UUID 门控要求 CMake >= 4.4。
          python -m pip install --quiet "cmake==4.4.2"
          cmake --version | Select-Object -First 1
          choco install ninja -y --no-progress

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure HuxerUI SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Join-Path $env:GITHUB_WORKSPACE 'huxerui-sdk'
          # HuxerUI 的目标配置函数会重置平台定义变量；用编译器级宏确保
          # 预编译 SDK 的 Win32 框架保留 llm-switch 的应用图标绑定。
          cmake -S third_party/huxerui -B sdk-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$sdk" `
            -DHUXERUI_BUILD_SHARED=ON `
            -DHUXERUI_BUILD_STATIC=OFF `
            -DHUXERUI_BUILD_TESTS=OFF `
            -DHUXERUI_BUILD_TESTING_LIBRARY=OFF `
            -DHUXERUI_BUILD_TESTING_SMOKE_TESTS=OFF `
            -DHUXERUI_BUILD_EXAMPLES=OFF `
            -DHUXERUI_BUILD_CLI=ON `
            -DHUXERUI_ENABLE_PROFILING=OFF `
            -DCMAKE_CXX_FLAGS="/DHUXERUI_WINDOWS_APPLICATION_ICON_RESOURCE_ID=101"

      - name: Build and install HuxerUI SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build sdk-build --config Release --parallel
          cmake --install sdk-build --config Release
          $sdk = Join-Path $env:GITHUB_WORKSPACE 'huxerui-sdk'
          foreach ($path in @(
            (Join-Path $sdk 'bin/huxerui.exe'),
            (Join-Path $sdk 'bin/huxerui.dll'),
            (Join-Path $sdk 'lib/cmake/HuxerUI/HuxerUIConfig.cmake'),
            (Join-Path $sdk 'share/huxerui/resources/huxerui/resources.bin'),
            (Join-Path $sdk 'share/huxerui/tools/windows/x86_64/hrc.exe')
          )) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "HuxerUI SDK file is missing: $path" }
          }
          Get-ChildItem $sdk -Recurse -File | Measure-Object -Property Length -Sum

      - name: Package HuxerUI SDK artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path huxerui-sdk\* `
            -DestinationPath dist\huxerui-sdk-windows-x86_64.zip -Force
          Get-Item dist\huxerui-sdk-windows-x86_64.zip

      - name: Upload HuxerUI SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: huxerui-windows-sdk
          path: dist/huxerui-sdk-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14

  # SDK 完成后，主程序 zip 与 setup.exe 两条腿并行。
  build-windows:
    name: build-windows-x86_64
    runs-on: windows-latest
    needs: build-windows-sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download HuxerUI SDK artifact
        uses: actions/download-artifact@v4
        with:
          name: huxerui-windows-sdk
          path: sdk-artifact

      - name: Unpack HuxerUI SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Get-ChildItem sdk-artifact -File -Filter '*.zip' | Select-Object -First 1
          if (-not $archive) { throw 'HuxerUI SDK artifact archive not found' }
          Expand-Archive -Path $archive.FullName -DestinationPath huxerui-sdk -Force
          $sdk = (Resolve-Path huxerui-sdk).Path
          if (-not (Test-Path (Join-Path $sdk 'lib/cmake/HuxerUI/HuxerUIConfig.cmake'))) {
            throw "Invalid HuxerUI SDK extracted at $sdk"
          }
          "HUXERUI_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure CMake >= 4.4 and Ninja
        shell: pwsh
        run: |
          # import std 的 experimental UUID 门控要求 CMake ≥ 4.4
          # （cmake/CxxImportStdGate.cmake）；runner 自带版本不够时 pip 补齐。
          python -m pip install --quiet "cmake==4.4.2"
          cmake --version | Select-Object -First 1
          choco install ninja -y --no-progress

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DHUXERUI_HOME="$env:HUXERUI_HOME" `
            -DLLMSWITCH_HUXERUI_FORCE_SDK=ON

      - name: Build release
        run: cmake --build build --config Release --parallel

      - name: Smoke test
        run: ctest --test-dir build --output-on-failure

      - name: Stage executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'build/llm-switch.exe'
          if (-not (Test-Path $exe)) { throw "$exe not found" }
          New-Item -ItemType Directory -Force dist-src | Out-Null
          Copy-Item $exe dist-src\llm-switch.exe
          # 运行时 DLL（huxerui.dll / MSVC CRT）由构建 POST_BUILD 拷到 exe 旁
          foreach ($dll in @(Get-ChildItem (Split-Path -Parent (Resolve-Path $exe)) -File -Filter '*.dll')) {
            Copy-Item $dll.FullName "dist-src\$($dll.Name)" -Force
          }
          foreach ($pattern in @('huxerui.dll', 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (-not (Get-ChildItem dist-src -File -Filter $pattern -ErrorAction SilentlyContinue)) {
              throw "Windows runtime payload is missing $pattern"
            }
          }
          $resources = 'build/llm-switch.resources'
          if (Test-Path $resources -PathType Container) {
            Copy-Item $resources dist-src\llm-switch.resources -Recurse -Force
          }
          Get-Item dist-src/*

      - name: Package zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path dist-src\* -DestinationPath dist\llm-switch-windows-x86_64.zip -Force
          Get-Item dist/*

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: llm-switch-windows-x86_64
          path: dist/llm-switch-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14

  # 安装器（setup.exe + 水墨品牌安装页面）与 zip 并行，共用上面的 SDK。
  # huxerui package windows 仍会在本 job 编译应用与安装器 UI，但不会再编译
  # HuxerUI 框架；WiX nuget 依赖仍按官方流程在本 job 内准备。
  build-windows-installer:
    name: build-windows-installer-x86_64
    runs-on: windows-latest
    needs: build-windows-sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download HuxerUI SDK artifact
        uses: actions/download-artifact@v4
        with:
          name: huxerui-windows-sdk
          path: sdk-artifact

      - name: Unpack HuxerUI SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Get-ChildItem sdk-artifact -File -Filter '*.zip' | Select-Object -First 1
          if (-not $archive) { throw 'HuxerUI SDK artifact archive not found' }
          Expand-Archive -Path $archive.FullName -DestinationPath huxerui-sdk -Force
          $sdk = (Resolve-Path huxerui-sdk).Path
          if (-not (Test-Path (Join-Path $sdk 'bin/huxerui.exe'))) {
            throw "Invalid HuxerUI SDK extracted at $sdk"
          }
          "HUXERUI_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure CMake >= 4.4 and Ninja
        shell: pwsh
        run: |
          # import std 的 experimental UUID 门控要求 CMake ≥ 4.4
          # （cmake/CxxImportStdGate.cmake）；runner 自带版本不够时 pip 补齐。
          python -m pip install --quiet "cmake==4.4.2"
          cmake --version | Select-Object -First 1
          choco install ninja -y --no-progress

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Package HuxerUI installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = Join-Path $env:HUXERUI_HOME 'bin/huxerui.exe'
          if (-not (Test-Path $cli -PathType Leaf)) { throw "$cli not found" }
          # 使用已安装 SDK 的 CLI；官方流程会配置并构建 MSI、Burn bundle，
          # 并把 platform/windows/package/src 下的托管安装器 UI 嵌入 Setup.exe。
          & $cli package windows --profile release
          if ($LASTEXITCODE -ne 0) { throw "huxerui package windows failed with exit code $LASTEXITCODE" }
          $versionMatch = Select-String -Path CMakeLists.txt -Pattern 'project\(llm-switch VERSION ([^ )]+)' | Select-Object -First 1
          if (-not $versionMatch) { throw 'Unable to determine project version from CMakeLists.txt' }
          $version = $versionMatch.Matches[0].Groups[1].Value
          if (-not $version) { throw 'Unable to determine project version from CMakeLists.txt' }
          $setup = "dist/windows/llm-switch-Setup-$version.exe"
          if (-not (Test-Path $setup -PathType Leaf)) { throw "$setup not found" }
          Copy-Item $setup 'dist/llm-switch-windows-x86_64-setup.exe' -Force
          Get-Item dist/llm-switch-windows-x86_64-setup.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: llm-switch-windows-installer-x86_64
          path: dist/llm-switch-windows-x86_64-setup.exe
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------ macOS
  # 工具链沿用 Clash-Flux 实证：整链 brew LLVM clang/libc++（.mm 框架层只能
  # clang 编，std 类型贯穿 .mm/.cpp 接口必须单一标准库；AppleClang 不被
  # CMake 的 C++20 模块扫描支持）。brew llvm 不带 libc++.modules.json，按
  # 上游 schema 生成。上游 window.h 的 CrossAlign(...) 函数式转型依赖
  # P0960（clang 的 ObjC++ 模式未实现），CI 内联打补丁（仓库不持有
  # cmake/patches）。
  build-macos:
    name: build-macos-arm64
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Fetch HuxerUI source (pinned) + P0960 patch
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$HUXERUI_REPO" third_party/huxerui
          git -C third_party/huxerui checkout "$HUXERUI_COMMIT"
          # P0960 聚合函数式转型 → 花括号初始化（clang ObjC++ 不支持 P0960；
          # 上游 window.h 在钉住的 commit 仍未修）。
          git -C third_party/huxerui apply <<'PATCH'
          diff --git a/include/huxerui/window.h b/include/huxerui/window.h
          index f172894..72c6476 100644
          --- a/include/huxerui/window.h
          +++ b/include/huxerui/window.h
          @@ -249,7 +249,12 @@ class WindowTitleBar final : public Layout<WindowTitleBar> {
           public:
             /// Constructs a title bar from an existing child collection.
             explicit WindowTitleBar(std::vector<View> children) : Layout(std::move(children)) {
          -    this->ApplyModifiers(WindowDragRegion{}, CrossAlign(CrossAxisAlignment::Center));
          +    // NOTE(llm-switch CI patch): functional-style cast to the CrossAlign
          +    // aggregate relies on P0960, which clang does not implement in Objective-C++
          +    // mode — every appkit *.mm TU failed to compile on macOS ("no matching
          +    // conversion for functional-style cast"). Brace initialization works in all
          +    // languages/compilers. Suggest upstream adopt CrossAlign{...} here.
          +    this->ApplyModifiers(WindowDragRegion{}, CrossAlign{CrossAxisAlignment::Center});
             }
           
             /// Constructs a title bar from ordinary View children.
          PATCH

      - name: Install dependencies (brew llvm)
        run: |
          brew install llvm
          llvm_prefix="$(brew --prefix llvm)"
          mod_dir="$llvm_prefix/share/libc++/v1"
          # brew llvm 只装模块源不带 libc++.modules.json（formula 未开
          # LIBCXX_ENABLE_STD_MODULES）——按上游 schema 生成一份，写进 brew
          # 的 lib/ 使 -print-file-name 发现路径命中。
          for f in std.cppm std.compat.cppm; do
            test -f "$mod_dir/$f" || { echo "missing $mod_dir/$f (brew llvm layout changed?)" >&2; exit 1; }
          done
          python3 - "$mod_dir" "$llvm_prefix/lib/libc++.modules.json" <<'PY'
          import json, sys
          mod_dir, out = sys.argv[1], sys.argv[2]
          mod = lambda name: {"logical-name": name, "source-path": mod_dir + "/" + name + ".cppm", "is-std-library": True, "local-arguments": {"system-include-directories": [mod_dir]}}
          json.dump({"version": 1, "revision": 1, "modules": [mod("std"), mod("std.compat")]}, open(out, "w"), indent=1)
          PY
          echo "LLVM_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
          cmake --version
          ninja --version

      - name: Configure
        run: |
          set -euo pipefail
          # 要点（Clash-Flux 实证）：OBJCXX 必须显式指定 brew clang，否则
          # CMake 默认拿 xcrun 的 AppleClang 混回两套 libc++；链接行按 brew
          # llvm caveats 配方（libc++/libc++abi 在 lib/c++，libunwind 在
          # lib/unwind，-L 指错会落到 SDK 系统 libc++ tbd 报 undefined
          # symbol）；_LIBCPP_DISABLE_AVAILABILITY 关闭针对系统 dylib 的假
          # 可用性标注（本链链 brew 自带 dylib）；CMAKE_CXX_STDLIB_MODULES_JSON
          # 显式注入上一步生成的元数据。部署目标 14.0（框架已用 macOS 14 API）。
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$LLVM_PREFIX/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM_PREFIX/bin/clang++" \
            -DCMAKE_OBJCXX_COMPILER="$LLVM_PREFIX/bin/clang++" \
            -DCMAKE_CXX_FLAGS='-stdlib=libc++ -D_LIBCPP_DISABLE_AVAILABILITY' \
            -DCMAKE_OBJCXX_FLAGS='-stdlib=libc++ -D_LIBCPP_DISABLE_AVAILABILITY' \
            -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -L$LLVM_PREFIX/lib/c++ -L$LLVM_PREFIX/lib/unwind -lc++ -lc++abi -lunwind" \
            -DCMAKE_SHARED_LINKER_FLAGS="-stdlib=libc++ -L$LLVM_PREFIX/lib/c++ -L$LLVM_PREFIX/lib/unwind -lc++ -lc++abi -lunwind" \
            -DCMAKE_MODULE_LINKER_FLAGS="-stdlib=libc++ -L$LLVM_PREFIX/lib/c++ -L$LLVM_PREFIX/lib/unwind -lc++ -lc++abi -lunwind" \
            -DCMAKE_CXX_STDLIB_MODULES_JSON="$LLVM_PREFIX/lib/libc++.modules.json" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0

      - name: Build release
        run: cmake --build build --config Release --parallel

      - name: Smoke test
        run: ctest --test-dir build --output-on-failure

      - name: Stage app bundle
        run: |
          set -euo pipefail
          # huxerui_add_app 在 APPLE 上产 .app bundle
          test -d build/llm-switch.app
          mkdir -p dist
          tar -czf dist/llm-switch-macos-arm64.tar.gz -C build llm-switch.app
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: llm-switch-macos-arm64
          path: dist/llm-switch-macos-arm64.tar.gz
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------- release
  # 仅 tag push（v*）触发。三个平台 job 全部成功后才下载产物并发布，
  # 发布前再次检查至少存在一个产物，禁止创建空 Release。
  release:
    name: release
    needs: [build-linux, build-windows-sdk, build-windows, build-windows-installer, build-macos]
    runs-on: ubuntu-24.04
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-linux.result == 'success' &&
      needs.build-windows-sdk.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-windows-installer.result == 'success' &&
      needs.build-macos.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: llm-switch-*
          path: dist
          merge-multiple: true

      - name: Add version to release asset names
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != v* ]]; then
            echo "Expected a v-prefixed release tag, got: $GITHUB_REF_NAME"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          for suffix in \
            linux-x86_64.tar.gz \
            linux-x86_64.deb \
            linux-x86_64.rpm \
            windows-x86_64.zip \
            windows-x86_64-setup.exe \
            macos-arm64.tar.gz; do
            source="dist/llm-switch-${suffix}"
            target="dist/llm-switch-${version}-${suffix}"
            test -f "$source"
            mv "$source" "$target"
          done
          ls -lh dist

      - name: Verify packaged artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != v* ]]; then
            echo "Expected a v-prefixed release tag, got: $GITHUB_REF_NAME"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          for artifact in \
            "llm-switch-${version}-linux-x86_64.tar.gz" \
            "llm-switch-${version}-linux-x86_64.deb" \
            "llm-switch-${version}-linux-x86_64.rpm" \
            "llm-switch-${version}-windows-x86_64.zip" \
            "llm-switch-${version}-windows-x86_64-setup.exe" \
            "llm-switch-${version}-macos-arm64.tar.gz"; do
            test -f "dist/$artifact"
          done
          ls -lh dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: llm-switch ${{ github.ref_name }}
          files: dist/*
